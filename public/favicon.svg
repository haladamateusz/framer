<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>Photo frame</title>
  <style>
    .frame {
      fill: none;
      stroke: #a31456;
    }

    .photo {
      fill: #a31456;
    }

    @media (prefers-color-scheme: dark) {
      .frame {
        stroke: #ff8ec4;
      }

      .photo {
        fill: #ff8ec4;
      }
    }
  </style>
  <rect class="frame" x="6.125" y="2.125" width="19.75" height="27.75" rx="1.25" stroke-width="2.25" />
  <rect class="photo" x="10" y="6" width="12" height="16" />
</svg>
